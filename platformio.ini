; ====================================================================
; Proyecto: SIGATOK - Estación Agrometeorológica y Monitoreo Foliar
; Institución: Universidad Tecnológica de Pereira (UTP) - Semillero Kilby
; Autor: Daniel Felipe Duque Lizarralde
; Arquitectura: C++17 Modular con Arduino Framework sobre ESP32 DevKit v1
; ====================================================================

[platformio]
default_envs = esp32dev
description = Firmware C++ modular para la estación agrometeorológica SIGATOK (ESP32 DevKit v1)

[env]
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -Iinclude
    -Ilib/SignalProcessing
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
lib_deps = 
    adafruit/Adafruit ADS1X15 @ ^2.4.2
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/RTClib @ ^2.1.4
    bblanchon/ArduinoJson @ ^7.3.0

; --- Entorno Único: ESP32 DevKit v1 (Hardware de Campo Heredado) ---
[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
build_flags = 
    ${env.build_flags}
    -DBOARD_ESP32_DEVKIT_V1
